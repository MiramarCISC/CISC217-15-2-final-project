[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="cisc217-final-character-game"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1.0","uvicorn>=0.30,<1.0","jinja2>=3.1,<4.0","SQLAlchemy>=2.0,<3.0"]

[project.optional-dependencies]
test=["pytest>=8.0","httpx>=0.27"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
markers=["cleanup_guard: instructor example must be removed"]
